services:

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: ./backend
    image: backend:latest
    container_name: backend
    restart: always
    depends_on:
      - mailhog
    environment:
      DATABASE_URL: postgresql://app_user:pass123@db:5432/user_project
      SMTP_HOST: mailhog
      SMTP_PORT: 1025

    ports:
      - "8000:8000"

    command:
      uvicorn main:app --host 0.0.0.0 --port 8000